[project]
name = "benkyou-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1.4",
    "djangorestframework>=3.15.2",
    "psycopg>=3.2.3",
]

[tool.django-stubs]
django_settings_module = "benkyou_django.settings"

[tool.mypy]
exclude = "main/migrations"
follow_untyped_imports = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true

[tool.ruff.lint]
ignore = ["D100", "D101", "D104", "D106"]
preview = true
select = ["D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.1.3",
    "djangorestframework-stubs[compatible-mypy]>=3.15.3",
    "mypy>=1.14.1",
    "ruff>=0.8.5",
]
test = [
    "coverage>=7.6.10",
    "selenium>=4.27.1",
]
