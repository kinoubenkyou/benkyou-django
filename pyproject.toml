[project]
name = "benkyou-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1.4",
    "psycopg>=3.2.3",
]

[tool.mypy]
exclude = "main/migrations"
follow_untyped_imports = true
strict = true
untyped_calls_exclude = ["django"]

[tool.ruff.lint]
ignore = ["D100", "D101", "D104", "D106"]
preview = true
select = ["D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[dependency-groups]
dev = [
    "ruff>=0.8.5",
]
test = [
    "coverage>=7.6.10",
    "selenium>=4.27.1",
]
type-check = [
    "mypy>=1.14.1",
]
