[project]
name = "benkyou-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1.4",
    "mypy>=1.14.1",
    "ruff>=0.8.5",
    "selenium>=4.27.1",
]

[tool.mypy]
exclude = "main/migrations"

[[tool.mypy.overrides]]
module = ["django.*"]
follow_untyped_imports = true
