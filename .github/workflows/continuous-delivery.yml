on:
#  release:
#    types: [published]
  - push

jobs:

  deliver:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::050752647288:role/githubActionDelivery
      - run: aws ecr-public list-images
